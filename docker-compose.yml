version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cwls-mysql
    restart: always
    environment:
      MYSQL_DATABASE: cwls_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - cwls_data:/var/lib/mysql

  app:
    build: .
    container_name: cwls-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/cwls_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - db

volumes:
  cwls_data:
