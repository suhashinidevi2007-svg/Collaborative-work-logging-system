# Server port (reads cloud PORT if assigned, defaults to 8080)
server.port=${PORT:8080}

# Database Datasource Configuration
# Supports:
# 1. Supabase / PostgreSQL (e.g. jdbc:postgresql://aws-0-xx.pooler.supabase.com:6543/postgres)
# 2. Cloud or Local MySQL (e.g. jdbc:mysql://localhost:3306/cwls_db)
# 3. Cloud environment variables: SPRING_DATASOURCE_URL, SUPABASE_DB_URL, DATABASE_URL, MYSQL_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:${SUPABASE_DB_URL:${DATABASE_URL:${MYSQL_URL:jdbc:mysql://localhost:3306/cwls_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${SUPABASE_DB_USER:${MYSQLUSER:root}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${SUPABASE_DB_PASSWORD:${MYSQLPASSWORD:root}}}

# JPA / Hibernate configuration (Dialect and Driver are automatically detected based on the JDBC URL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false